<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temp Mail Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0f19; color: #f1f5f9; padding: 14px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    header { text-align: center; margin-bottom: 16px; }
    header h1 { font-size: 1.3rem; color: #38bdf8; }
    header p { font-size: 0.8rem; color: #94a3b8; }

    .card { background: #1e293b; padding: 14px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 12px; }
    .label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: bold; margin-bottom: 6px; }

    .email-box { display: flex; gap: 8px; align-items: center; }
    .email-input { flex: 1; background: #0f172a; border: 1px solid #475569; color: #38bdf8; padding: 10px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; overflow: hidden; text-overflow: ellipsis; }

    .btn { background: #38bdf8; color: #0b0f19; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn:active { opacity: 0.8; }

    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .status { font-size: 0.8rem; color: #10b981; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: blink 1.2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .inbox-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .mail-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #334155; cursor: pointer; }
    .mail-from { font-size: 0.8rem; color: #38bdf8; font-weight: bold; }
    .mail-subject { font-size: 0.9rem; font-weight: bold; margin: 3px 0; color: #f8fafc; }
    .empty { text-align: center; color: #64748b; font-size: 0.85rem; padding: 24px 0; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 14px; z-index: 100; }
    .modal-box { background: #1e293b; width: 100%; max-width: 480px; max-height: 85vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #475569; }
    .modal-top { padding: 12px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 14px; overflow-y: auto; font-size: 0.9rem; line-height: 1.5; color: #e2e8f0; word-break: break-word; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ Real Temp Mail Client</h1>
    <p>Live Inbound Mail Service</p>
  </header>

  <div class="card">
    <div class="label">Disposable Email Address</div>
    <div class="email-box">
      <input type="text" id="emailBox" class="email-input" readonly value="Creating address...">
      <button class="btn" onclick="copyMail()">Copy</button>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" style="flex:1" onclick="createMailbox()">🔄 New Email</button>
      <button class="btn btn-secondary" style="flex:1" onclick="fetchInbox()">📩 Refresh</button>
    </div>
    <div class="status">
      <span class="dot"></span>
      <span id="statText">Listening every 4 seconds...</span>
    </div>
  </div>

  <div class="card">
    <div class="inbox-header">
      <strong style="font-size: 0.95rem;">Inbox Messages</strong>
      <span id="msgCount" style="font-size: 0.75rem; color: #94a3b8;">0 messages</span>
    </div>
    <div id="inboxList">
      <div class="empty">Waiting for incoming emails...</div>
    </div>
  </div>
</div>

<div id="reader" class="modal">
  <div class="modal-box">
    <div class="modal-top">
      <b id="mSub" style="font-size: 0.9rem; max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Email</b>
      <button class="btn btn-secondary" style="padding: 4px 10px;" onclick="closeModal()">✕</button>
    </div>
    <div style="padding: 8px 12px; background: #0f172a; font-size: 0.75rem; color: #94a3b8;" id="mFrom"></div>
    <div class="modal-body" id="mHtml"></div>
  </div>
</div>

<script>
  const API_ENDPOINT = "https://dropmail.me/api/graphql/web-test-2024";
  let sessionId = "";
  let activeEmail = "";
  let messages = [];
  let pollInterval = null;

  async function createMailbox() {
    const box = document.getElementById("emailBox");
    box.value = "Creating address...";
    document.getElementById("inboxList").innerHTML = '<div class="empty">Waiting for incoming emails...</div>';
    document.getElementById("msgCount").innerText = "0 messages";

    const query = `mutation {
      introduceSession {
        id
        expiresAt
        addresses {
          address
        }
      }
    }`;

    try {
      const res = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });
      const json = await res.json();
      const session = json.data.introduceSession;
      sessionId = session.id;
      activeEmail = session.addresses[0].address;

      box.value = activeEmail;
      fetchInbox();
    } catch (err) {
      console.error("Create session error:", err);
      box.value = "Error. Click New Email to retry.";
    }
  }

  async function fetchInbox() {
    if (!sessionId) return;

    const query = `query {
      session(id: "${sessionId}") {
        mails {
          id
          fromAddr
          headerSubject
          text
          html
          receivedAt
        }
      }
    }`;

    try {
      const res = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });
      const json = await res.json();
      messages = json.data.session ? json.data.session.mails : [];
      renderInbox();
    } catch (err) {
      console.error("Fetch inbox error:", err);
    }
  }

  function renderInbox() {
    const listEl = document.getElementById("inboxList");
    const countEl = document.getElementById("msgCount");
    countEl.innerText = `${messages.length} message(s)`;

    if (messages.length === 0) {
      listEl.innerHTML = '<div class="empty">Waiting for emails... Send a test mail to check.</div>';
      return;
    }

    listEl.innerHTML = messages.map((m, index) => `
      <div class="mail-item" onclick="openMail(${index})">
        <div class="mail-from">${escapeHtml(m.fromAddr)}</div>
        <div class="mail-subject">${escapeHtml(m.headerSubject || "(No Subject)")}</div>
      </div>
    `).join("");
  }

  function openMail(index) {
    const mail = messages[index];
    if (!mail) return;

    document.getElementById("mSub").innerText = mail.headerSubject || "(No Subject)";
    document.getElementById("mFrom").innerText = `From: ${mail.fromAddr}`;
    
    const bodyContent = mail.html ? mail.html : `<pre style="white-space: pre-wrap;">${escapeHtml(mail.text || '')}</pre>`;
    document.getElementById("mHtml").innerHTML = bodyContent;
    document.getElementById("reader").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("reader").style.display = "none";
  }

  function copyMail() {
    const val = document.getElementById("emailBox").value;
    if (!val || val.includes("...")) return;
    navigator.clipboard.writeText(val);
    alert("Copied to clipboard: " + val);
  }

  function escapeHtml(str) {
    return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  createMailbox();
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(fetchInbox, 4000);
</script>

</body>
</html>
