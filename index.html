<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temp Mail Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #f1f5f9; padding: 14px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 460px; }
    header { text-align: center; margin-bottom: 16px; }
    header h1 { font-size: 1.3rem; color: #38bdf8; }
    header p { font-size: 0.8rem; color: #94a3b8; }
    
    .card { background: #1e293b; padding: 14px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 12px; }
    .label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: bold; margin-bottom: 6px; }
    
    .email-box { display: flex; gap: 8px; align-items: center; }
    .email-input { flex: 1; background: #0f172a; border: 1px solid #475569; color: #38bdf8; padding: 10px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; }
    
    .btn { background: #38bdf8; color: #0b0f19; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn:active { opacity: 0.8; }
    
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .status { font-size: 0.8rem; color: #10b981; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }

    .inbox-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .mail-item { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #334155; cursor: pointer; }
    .mail-from { font-size: 0.78rem; color: #38bdf8; }
    .mail-subject { font-size: 0.88rem; font-weight: bold; margin: 2px 0; }
    .empty { text-align: center; color: #64748b; font-size: 0.85rem; padding: 20px 0; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 14px; }
    .modal-box { background: #1e293b; width: 100%; max-width: 460px; max-height: 85vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #475569; }
    .modal-top { padding: 12px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 14px; overflow-y: auto; font-size: 0.9rem; line-height: 1.4; color: #e2e8f0; word-break: break-word; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ Real Temp Mail Client</h1>
    <p>Live Inbound Mail Service</p>
  </header>

  <div class="card">
    <div class="label">Disposable Email Address</div>
    <div class="email-box">
      <input type="text" id="emailBox" class="email-input" readonly value="Generating address...">
      <button class="btn" onclick="copyMail()">Copy</button>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" style="flex:1" onclick="fetchNewAddress()">🔄 New Email</button>
      <button class="btn btn-secondary" style="flex:1" onclick="checkMessages()">📩 Refresh</button>
    </div>
    <div class="status">
      <span class="dot"></span>
      <span id="statText">Auto checking every 6 seconds...</span>
    </div>
  </div>

  <div class="card">
    <div class="inbox-header">
      <strong style="font-size: 0.95rem;">Inbox Messages</strong>
      <span id="msgCount" style="font-size: 0.75rem; color: #94a3b8;">0 messages</span>
    </div>
    <div id="inboxList">
      <div class="empty">Waiting for emails...</div>
    </div>
  </div>
</div>

<div id="reader" class="modal">
  <div class="modal-box">
    <div class="modal-top">
      <b id="mSub" style="font-size: 0.9rem; max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Email</b>
      <button class="btn btn-secondary" style="padding: 4px 10px;" onclick="closeModal()">✕</button>
    </div>
    <div style="padding: 8px 12px; background: #0f172a; font-size: 0.75rem; color: #94a3b8;" id="mFrom"></div>
    <div class="modal-body" id="mHtml"></div>
  </div>
</div>

<script>
  let sidToken = '';
  let activeEmail = '';
  let pollInterval = null;

  async function fetchNewAddress() {
    const input = document.getElementById('emailBox');
    input.value = "Generating address...";
    try {
      const res = await fetch('https://api.guerrillamail.com/ajax.php?f=get_email_address');
      const data = await res.json();
      sidToken = data.sid_token;
      activeEmail = data.email_addr;
      input.value = activeEmail;
      checkMessages();
    } catch (e) {
      input.value = "Network error. Tap New Email again.";
      console.error(e);
    }
  }

  async function checkMessages() {
    if (!sidToken) return;
    try {
      const res = await fetch(`https://api.guerrillamail.com/ajax.php?f=check_email&seq=0&sid_token=${sidToken}`);
      const data = await res.json();
      const list = data.list || [];
      
      const countEl = document.getElementById('msgCount');
      const box = document.getElementById('inboxList');
      countEl.innerText = `${list.length} message(s)`;

      if (list.length === 0) {
        box.innerHTML = '<div class="empty">Waiting for emails...</div>';
        return;
      }

      box.innerHTML = list.map(item => `
        <div class="mail-item" onclick="openMsg('${item.mail_id}')">
          <div class="mail-from">${escapeStr(item.mail_from)}</div>
          <div class="mail-subject">${escapeStr(item.mail_subject || '(No Subject)')}</div>
          <div style="font-size:0.7rem; color:#64748b;">${item.mail_date}</div>
        </div>
      `).join('');
    } catch (e) {
      console.error(e);
    }
  }

  async function openMsg(id) {
    try {
      const res = await fetch(`https://api.guerrillamail.com/ajax.php?f=fetch_email&email_id=${id}&sid_token=${sidToken}`);
      const data = await res.json();

      document.getElementById('mSub').innerText = data.mail_subject || '(No Subject)';
      document.getElementById('mFrom').innerText = `From: ${data.mail_from} | ${data.mail_date}`;
      document.getElementById('mHtml').innerHTML = data.mail_body;
      document.getElementById('reader').style.display = 'flex';
    } catch (e) {
      alert("Error loading email body");
    }
  }

  function closeModal() {
    document.getElementById('reader').style.display = 'none';
  }

  function copyMail() {
    const val = document.getElementById('emailBox').value;
    if (!val || val.includes('...')) return;
    navigator.clipboard.writeText(val);
    alert('Email copied: ' + val);
  }

  function escapeStr(str) {
    return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  fetchNewAddress();
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(checkMessages, 6000);
</script>

</body>
  </html>
